<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGlowBiotin" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF0F3"/>
      <stop offset="60%" stop-color="#FDE2E4"/>
      <stop offset="100%" stop-color="#F6CCD2"/>
    </radialGradient>

    <!-- Bottle Glass Gradients (Rose Luxury Amber/Pink glass) -->
    <linearGradient id="bottleBodyBiotin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#801828" stop-opacity="0.95"/>
      <stop offset="18%" stop-color="#A52A3F"/>
      <stop offset="35%" stop-color="#C23B51"/>
      <stop offset="50%" stop-color="#E86A7C"/>
      <stop offset="70%" stop-color="#A52A3F"/>
      <stop offset="100%" stop-color="#540D17"/>
    </linearGradient>

    <linearGradient id="glassReflectionBiotin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="15%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="85%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Cap Luxury Metallic Gradient -->
    <linearGradient id="capGradBiotin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1B4332"/>
      <stop offset="25%" stop-color="#2D6A4F"/>
      <stop offset="50%" stop-color="#40916C"/>
      <stop offset="75%" stop-color="#2D6A4F"/>
      <stop offset="100%" stop-color="#1B4332"/>
    </linearGradient>

    <linearGradient id="goldAccentBiotin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#FFF2A1"/>
      <stop offset="100%" stop-color="#AA7C11"/>
    </linearGradient>

    <linearGradient id="labelGradBiotin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF5F7"/>
    </linearGradient>

    <filter id="shadowBiotin" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#540D17" flood-opacity="0.22"/>
    </filter>

    <filter id="gummyGlowBiotin" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#E86A7C" flood-opacity="0.5"/>
    </filter>

    <radialGradient id="gummyStrawberry" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FFCAD4"/>
      <stop offset="35%" stop-color="#E86A7C"/>
      <stop offset="75%" stop-color="#C23B51"/>
      <stop offset="100%" stop-color="#801828"/>
    </radialGradient>
  </defs>

  <!-- Canvas Backdrop -->
  <rect width="800" height="800" fill="url(#bgGlowBiotin)"/>

  <!-- Subtle Brand Motif Circles -->
  <circle cx="400" cy="420" r="320" fill="none" stroke="#E86A7C" stroke-width="2" stroke-dasharray="6 8" opacity="0.3"/>
  <circle cx="400" cy="420" r="350" fill="none" stroke="#1B4332" stroke-width="1.5" opacity="0.15"/>

  <!-- Ground Shadows -->
  <ellipse cx="400" cy="710" rx="190" ry="28" fill="#540D17" opacity="0.2" filter="blur(16px)"/>
  <ellipse cx="400" cy="705" rx="140" ry="16" fill="#38090F" opacity="0.28" filter="blur(8px)"/>

  <!-- ================= MAIN BOTTLE MOCKUP ================= -->
  <g filter="url(#shadowBiotin)">
    <!-- Bottle Base & Body -->
    <rect x="250" y="270" width="300" height="420" rx="42" fill="url(#bottleBodyBiotin)"/>

    <!-- Bottle Neck -->
    <rect x="310" y="210" width="180" height="70" rx="10" fill="url(#bottleBodyBiotin)"/>
    <ellipse cx="400" cy="275" rx="90" ry="12" fill="#540D17" opacity="0.6"/>

    <!-- Specular Highlight Lines -->
    <path d="M268 290 Q272 480 272 670" stroke="url(#glassReflectionBiotin)" stroke-width="16" stroke-linecap="round" fill="none" opacity="0.8"/>
    <path d="M528 290 Q528 480 528 670" stroke="#ffffff" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.3"/>

    <!-- Bottle Luxury Cap (Emerald with Gold Band) -->
    <rect x="300" y="200" width="200" height="12" rx="4" fill="url(#goldAccentBiotin)"/>
    <rect x="290" y="110" width="220" height="95" rx="14" fill="url(#capGradBiotin)"/>
    <g opacity="0.2" stroke="#ffffff" stroke-width="2">
      <line x1="310" y1="120" x2="310" y2="195"/>
      <line x1="325" y1="120" x2="325" y2="195"/>
      <line x1="340" y1="120" x2="340" y2="195"/>
      <line x1="355" y1="120" x2="355" y2="195"/>
      <line x1="370" y1="120" x2="370" y2="195"/>
      <line x1="385" y1="120" x2="385" y2="195"/>
      <line x1="400" y1="120" x2="400" y2="195"/>
      <line x1="415" y1="120" x2="415" y2="195"/>
      <line x1="430" y1="120" x2="430" y2="195"/>
      <line x1="445" y1="120" x2="445" y2="195"/>
      <line x1="460" y1="120" x2="460" y2="195"/>
      <line x1="475" y1="120" x2="475" y2="195"/>
      <line x1="490" y1="120" x2="490" y2="195"/>
    </g>
    <ellipse cx="400" cy="115" rx="100" ry="12" fill="#52B788" opacity="0.4"/>
    <ellipse cx="400" cy="114" rx="80" ry="8" fill="#ffffff" opacity="0.25"/>

    <!-- ================= PREMIUM LABEL DESIGN ================= -->
    <g>
      <rect x="260" y="320" width="280" height="340" rx="18" fill="url(#labelGradBiotin)"/>
      <rect x="260" y="320" width="280" height="340" rx="18" fill="none" stroke="#1B4332" stroke-width="2.5" opacity="0.6"/>

      <!-- Label Top Banner Strip -->
      <path d="M260 320 Q400 326 540 320 L540 365 Q400 371 260 365 Z" fill="#E86A7C"/>
      <text x="400" y="348" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" letter-spacing="1">
        ⭐ الأكثر طلباً للشعر والأظافر في المغرب
      </text>

      <!-- NOVAVITA Circular "N" Emblem -->
      <g transform="translate(400, 415)">
        <circle cx="0" cy="0" r="32" fill="#FAF8F5" stroke="#1B4332" stroke-width="3.5"/>
        <circle cx="0" cy="0" r="28" fill="none" stroke="#E86A7C" stroke-width="1.2" stroke-dasharray="3 2"/>
        <text x="0" y="12" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="34" font-weight="900" fill="#1B4332">N</text>
      </g>

      <!-- Brand Typography -->
      <text x="400" y="475" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="28" font-weight="900" fill="#1B4332" letter-spacing="3">
        NOVAVITA
      </text>
      <text x="400" y="496" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="11" font-weight="700" fill="#E86A7C" letter-spacing="1.5">
        HAIR, SKIN &amp; NAILS COMPLEX
      </text>

      <!-- Gold Ribbon -->
      <line x1="310" y1="510" x2="490" y2="510" stroke="url(#goldAccentBiotin)" stroke-width="2"/>

      <!-- Product Major Name -->
      <text x="400" y="538" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="19" font-weight="900" fill="#1B4332">
        BIOTIN 5000 mcg + ZINC
      </text>
      <text x="400" y="558" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="14" font-weight="800" fill="#E86A7C">
        بيوتين نقي + زنك + فيتامين C
      </text>

      <!-- Key Benefits Micro-tag -->
      <rect x="290" y="575" width="220" height="26" rx="13" fill="#E86A7C" opacity="0.12"/>
      <text x="400" y="593" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="11.5" font-weight="800" fill="#C23B51">
        وقف التساقط وإنبات الفراغات 💇‍♀️
      </text>

      <!-- Bottom Specs: 60 Gummies • Strawberry -->
      <g transform="translate(400, 634)">
        <rect x="-110" y="-14" width="220" height="26" rx="13" fill="#1B4332"/>
        <text x="0" y="4" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="12" font-weight="900" fill="#FFFFFF">
          60 GUMMIES • نكهة الفراولة الطبيعية 🍓
        </text>
      </g>
    </g>
  </g>

  <!-- ================= FLOATING STRAWBERRY GUMMIES ================= -->
  <g transform="translate(180, 590) rotate(-14)" filter="url(#gummyGlowBiotin)">
    <ellipse cx="0" cy="0" rx="38" ry="46" fill="url(#gummyStrawberry)"/>
    <path d="M-18 -26 Q-12 -36 10 -32 Q-6 -22 -14 -8 Z" fill="#ffffff" opacity="0.65"/>
    <ellipse cx="-12" cy="12" rx="10" ry="16" fill="#ffffff" opacity="0.25"/>
    <text x="0" y="8" text-anchor="middle" font-size="20">🍓</text>
  </g>

  <g transform="translate(620, 570) rotate(18)" filter="url(#gummyGlowBiotin)">
    <ellipse cx="0" cy="0" rx="34" ry="42" fill="url(#gummyStrawberry)"/>
    <path d="M-14 -22 Q-8 -30 8 -26 Q-4 -18 -10 -6 Z" fill="#ffffff" opacity="0.65"/>
    <ellipse cx="8" cy="10" rx="8" ry="14" fill="#ffffff" opacity="0.25"/>
    <text x="0" y="8" text-anchor="middle" font-size="18">✨</text>
  </g>

  <g transform="translate(600, 310) rotate(-30)" filter="url(#gummyGlowBiotin)">
    <ellipse cx="0" cy="0" rx="24" ry="30" fill="url(#gummyStrawberry)"/>
    <path d="M-8 -14 Q-4 -20 6 -16 Q-2 -10 -6 -2 Z" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- Quality Stamp Badge -->
  <g transform="translate(150, 150) rotate(-12)" filter="url(#shadowBiotin)">
    <circle cx="0" cy="0" r="48" fill="#E86A7C" stroke="url(#goldAccentBiotin)" stroke-width="3"/>
    <circle cx="0" cy="0" r="42" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="0" y="-12" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="10.5" font-weight="900" fill="#FFF2A1">MAROC</text>
    <text x="0" y="4" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="13" font-weight="900" fill="#FFFFFF">100% حلال</text>
    <text x="0" y="19" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="9" font-weight="800" fill="#FFF2A1">بدون جيلاتين</text>
  </g>
</svg>
