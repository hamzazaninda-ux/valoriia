<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FAF4EE"/>
      <stop offset="60%" stop-color="#F2ECE4"/>
      <stop offset="100%" stop-color="#E8E0D5"/>
    </radialGradient>

    <!-- Bottle Glass Gradients -->
    <linearGradient id="bottleBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#143427" stop-opacity="0.95"/>
      <stop offset="18%" stop-color="#1B4332"/>
      <stop offset="35%" stop-color="#2D6A4F"/>
      <stop offset="50%" stop-color="#40916C"/>
      <stop offset="70%" stop-color="#1B4332"/>
      <stop offset="100%" stop-color="#081C15"/>
    </linearGradient>

    <linearGradient id="glassReflection" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="15%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="85%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Cap Luxury Metallic Emerald Gradient -->
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#081C15"/>
      <stop offset="25%" stop-color="#1B4332"/>
      <stop offset="50%" stop-color="#2D6A4F"/>
      <stop offset="75%" stop-color="#1B4332"/>
      <stop offset="100%" stop-color="#081C15"/>
    </linearGradient>

    <!-- Cap Gold Ribbing & Ring -->
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#FFF2A1"/>
      <stop offset="100%" stop-color="#AA7C11"/>
    </linearGradient>

    <!-- Label Gradient -->
    <linearGradient id="labelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF7"/>
      <stop offset="100%" stop-color="#F3ECE2"/>
    </linearGradient>

    <!-- Gummy Bear / Berry Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#0e231b" flood-opacity="0.22"/>
    </filter>

    <filter id="gummyGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#E86A7C" flood-opacity="0.45"/>
    </filter>

    <!-- Gummy Texture Gradient -->
    <radialGradient id="gummyBerry" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FFA8B6"/>
      <stop offset="35%" stop-color="#E86A7C"/>
      <stop offset="75%" stop-color="#C23B51"/>
      <stop offset="100%" stop-color="#801828"/>
    </radialGradient>
  </defs>

  <!-- Canvas Backdrop -->
  <rect width="800" height="800" fill="url(#bgGlow)"/>

  <!-- Subtle Brand Motif Circles in Background -->
  <circle cx="400" cy="420" r="320" fill="none" stroke="#E86A7C" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.25"/>
  <circle cx="400" cy="420" r="350" fill="none" stroke="#1B4332" stroke-width="2" opacity="0.12"/>

  <!-- Bottle Ground Cast Shadow -->
  <ellipse cx="400" cy="710" rx="190" ry="28" fill="#143427" opacity="0.22" filter="blur(16px)"/>
  <ellipse cx="400" cy="705" rx="140" ry="16" fill="#081C15" opacity="0.32" filter="blur(8px)"/>

  <!-- ================= MAIN BOTTLE MOCKUP ================= -->
  <g filter="url(#shadow)">
    <!-- Bottle Base & Body -->
    <rect x="250" y="270" width="300" height="420" rx="42" fill="url(#bottleBody)"/>

    <!-- Bottle Neck -->
    <rect x="310" y="210" width="180" height="70" rx="10" fill="url(#bottleBody)"/>
    <ellipse cx="400" cy="275" rx="90" ry="12" fill="#143427" opacity="0.6"/>

    <!-- Glass Specular Reflection Highlight Line -->
    <path d="M268 290 Q272 480 272 670" stroke="url(#glassReflection)" stroke-width="16" stroke-linecap="round" fill="none" opacity="0.75"/>
    <path d="M528 290 Q528 480 528 670" stroke="#ffffff" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.25"/>

    <!-- Bottle Luxury Cap -->
    <!-- Cap Neck Ring -->
    <rect x="300" y="200" width="200" height="12" rx="4" fill="url(#goldAccent)"/>
    <!-- Main Cap -->
    <rect x="290" y="110" width="220" height="95" rx="14" fill="url(#capGrad)"/>
    <!-- Cap Ridges (Safety Grip Texture) -->
    <g opacity="0.18" stroke="#ffffff" stroke-width="2">
      <line x1="310" y1="120" x2="310" y2="195"/>
      <line x1="325" y1="120" x2="325" y2="195"/>
      <line x1="340" y1="120" x2="340" y2="195"/>
      <line x1="355" y1="120" x2="355" y2="195"/>
      <line x1="370" y1="120" x2="370" y2="195"/>
      <line x1="385" y1="120" x2="385" y2="195"/>
      <line x1="400" y1="120" x2="400" y2="195"/>
      <line x1="415" y1="120" x2="415" y2="195"/>
      <line x1="430" y1="120" x2="430" y2="195"/>
      <line x1="445" y1="120" x2="445" y2="195"/>
      <line x1="460" y1="120" x2="460" y2="195"/>
      <line x1="475" y1="120" x2="475" y2="195"/>
      <line x1="490" y1="120" x2="490" y2="195"/>
    </g>
    <!-- Cap Top Bevel & Highlight -->
    <ellipse cx="400" cy="115" rx="100" ry="12" fill="#40916C" opacity="0.4"/>
    <ellipse cx="400" cy="114" rx="80" ry="8" fill="#ffffff" opacity="0.2"/>

    <!-- ================= PREMIUM LABEL DESIGN ================= -->
    <g>
      <!-- Label Base Canvas -->
      <rect x="260" y="320" width="280" height="340" rx="18" fill="url(#labelGrad)"/>
      <rect x="260" y="320" width="280" height="340" rx="18" fill="none" stroke="#E86A7C" stroke-width="2.5" opacity="0.7"/>

      <!-- Label Top Banner Strip -->
      <path d="M260 320 Q400 326 540 320 L540 365 Q400 371 260 365 Z" fill="#1B4332"/>
      <text x="400" y="348" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="13" font-weight="800" fill="#FFF2A1" letter-spacing="1">
        ✨ 100% VEGAN PECTIN • HALAL CERTIFIED
      </text>

      <!-- NOVAVITA Circular "N" Emblem -->
      <g transform="translate(400, 415)">
        <circle cx="0" cy="0" r="32" fill="#FAF8F5" stroke="#1B4332" stroke-width="3.5"/>
        <circle cx="0" cy="0" r="28" fill="none" stroke="#E86A7C" stroke-width="1.2" stroke-dasharray="3 2"/>
        <text x="0" y="12" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="34" font-weight="900" fill="#1B4332">N</text>
      </g>

      <!-- Brand Typography -->
      <text x="400" y="475" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="28" font-weight="900" fill="#1B4332" letter-spacing="3">
        NOVAVITA
      </text>
      <text x="400" y="496" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="11" font-weight="700" fill="#E86A7C" letter-spacing="1.5">
        BEAUTY &amp; WELLNESS GUMMIES
      </text>

      <!-- Gold Divider Ribbon -->
      <line x1="310" y1="510" x2="490" y2="510" stroke="url(#goldAccent)" stroke-width="2"/>

      <!-- Product Major Name -->
      <text x="400" y="538" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="18" font-weight="900" fill="#1B4332">
        HYDROLYZED COLLAGEN
      </text>
      <text x="400" y="558" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="14" font-weight="800" fill="#E86A7C">
        كولاجين بحري + فيتامين C &amp; E
      </text>

      <!-- Key Benefits Micro-tag -->
      <rect x="290" y="575" width="220" height="26" rx="13" fill="#1B4332" opacity="0.08"/>
      <text x="400" y="593" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="11.5" font-weight="800" fill="#1B4332">
        نضارة البشرة ومحاربة التجاعيد ✨
      </text>

      <!-- Bottom Specs: 60 Gummies • Wild Berry -->
      <g transform="translate(400, 634)">
        <rect x="-110" y="-14" width="220" height="26" rx="13" fill="#E86A7C"/>
        <text x="0" y="4" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="12" font-weight="900" fill="#FFFFFF">
          60 GUMMIES • نكهة التوت المنعشة 🫐
        </text>
      </g>
    </g>
  </g>

  <!-- ================= FLOATING DELICIOUS GUMMIES ================= -->
  <!-- Gummy 1: Left Foreground (Wild Berry Drop) -->
  <g transform="translate(180, 600) rotate(-18)" filter="url(#gummyGlow)">
    <ellipse cx="0" cy="0" rx="38" ry="46" fill="url(#gummyBerry)"/>
    <!-- Gummy Glossy 3D Highlight -->
    <path d="M-18 -26 Q-12 -36 10 -32 Q-6 -22 -14 -8 Z" fill="#ffffff" opacity="0.65"/>
    <ellipse cx="-12" cy="12" rx="10" ry="16" fill="#ffffff" opacity="0.25"/>
    <text x="0" y="8" text-anchor="middle" font-size="20">🍓</text>
  </g>

  <!-- Gummy 2: Right Floating (Marine Berry) -->
  <g transform="translate(620, 560) rotate(22)" filter="url(#gummyGlow)">
    <ellipse cx="0" cy="0" rx="34" ry="42" fill="url(#gummyBerry)"/>
    <path d="M-14 -22 Q-8 -30 8 -26 Q-4 -18 -10 -6 Z" fill="#ffffff" opacity="0.65"/>
    <ellipse cx="8" cy="10" rx="8" ry="14" fill="#ffffff" opacity="0.25"/>
    <text x="0" y="8" text-anchor="middle" font-size="18">🫐</text>
  </g>

  <!-- Gummy 3: Small Floating Top Right -->
  <g transform="translate(590, 310) rotate(-35)" filter="url(#gummyGlow)">
    <ellipse cx="0" cy="0" rx="24" ry="30" fill="url(#gummyBerry)"/>
    <path d="M-8 -14 Q-4 -20 6 -16 Q-2 -10 -6 -2 Z" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- Quality Stamp Badge (Top Left Corner) -->
  <g transform="translate(150, 150) rotate(-12)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="48" fill="#1B4332" stroke="url(#goldAccent)" stroke-width="3"/>
    <circle cx="0" cy="0" r="42" fill="none" stroke="#FAF8F5" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="0" y="-12" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="10.5" font-weight="900" fill="#FFF2A1">MAROC</text>
    <text x="0" y="4" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="13" font-weight="900" fill="#FAF8F5">100% حلال</text>
    <text x="0" y="19" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="9" font-weight="800" fill="#E86A7C">بكتين نباتي</text>
  </g>
</svg>
